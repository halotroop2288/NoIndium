name: Build with Gradle

on:
  push:
    branches: [ "1.18.2" ]
  pull_request:
    branches: [ "1.18.2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.1' # Quotes required to prevent YAML converting to number
    - run: gradle build
    - uses: actions/upload-artifact@v4
      with:
        path: build/libs/*.jar
